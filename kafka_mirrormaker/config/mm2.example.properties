# Example MM2 dedicated properties (redacted). Copy to the MM host; do not put secrets in git.
#
# Typical unit:
#   ExecStart=/var/opt/kafka/bin/connect-mirror-maker.sh /var/opt/kafka/config/mm2.properties

clusters = prod, dr
prod.bootstrap.servers = 10.0.0.1:9094,10.0.0.2:9094
dr.bootstrap.servers = 10.0.1.1:9094,10.0.1.2:9094

prod->dr.enabled = true
prod->dr.topics = .*
# prod->dr.groups = .*

replication.policy.class = org.apache.kafka.connect.mirror.DefaultReplicationPolicy
# replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

sync.topic.configs.enabled = true
sync.group.offsets.enabled = false
emit.heartbeats.enabled = true
emit.checkpoints.enabled = true
offset-syncs.topic.location = source

replication.factor = 3
checkpoints.topic.replication.factor = 3
heartbeats.topic.replication.factor = 3
offset-syncs.topic.replication.factor = 3
tasks.max = 4
refresh.topics.interval.seconds = 300
refresh.groups.interval.seconds = 300

# SASL (example — keep real files off git)
